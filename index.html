    <meta charset="UTF-8" />

    <meta name="theme-color" content="#06060c" />
    <script>
      // Apply the saved palette + light/dark mode before first paint to avoid a flash.
      (function () {
        try {
          var mode = localStorage.getItem("portfolio-mode-v1") === "light" ? "light" : "dark";
          var accentKey =
            mode === "light" ? "portfolio-accent-light-v2" : "portfolio-accent-dark-v2";
          var accent = localStorage.getItem(accentKey);
          document.documentElement.dataset.mode = mode;
          document.documentElement.dataset.accent = accent || "emerald";
        } catch (error) {
          document.documentElement.dataset.accent = "emerald";
          document.documentElement.dataset.mode = "dark";
        }
      })();
    </script>
